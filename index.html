<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaan Şimşek</title>
    <link rel="icon" type="image/svg+xml" href="images/icons/favicon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="landing">
      <div class="grid-bg"></div>
      <div class="watermark">KŞ</div>

      <!-- Desktop layout -->
      <div class="view view-desktop">
        <div class="intro">
          <div class="name">Kaan Şimşek</div>
          <div class="role">Software Developer</div>
        </div>

        <div class="cards-fan">
          <a
            class="fan-card fan-card--1"
            href="https://www.linkedin.com/in/kaansimsekk"
            target="_blank"
            rel="noopener"
          >
            <span class="fan-card-label">Linkedin</span>
            <span class="fan-card-index">01</span>
          </a>

          <a
            class="fan-card fan-card--2"
            href="https://github.com/kaansimseq"
            target="_blank"
            rel="noopener"
          >
            <span class="fan-card-label">Github</span>
            <span class="fan-card-index">02</span>
          </a>

          <a
            class="fan-card fan-card--3"
            href="https://apps.apple.com/us/developer/kaan-simsek/id1811808533"
            target="_blank"
            rel="noopener"
          >
            <span class="fan-card-label">My Apps</span>
            <span class="fan-card-index">03</span>
          </a>

          <a
            class="fan-card fan-card--4"
            href="images/KaanSimsekCV.pdf"
            target="_blank"
            rel="noopener"
          >
            <span class="fan-card-label">CV</span>
            <span class="fan-card-footer">
              <span class="fan-card-index">04</span>
              <span class="fan-card-arrow">↗</span>
            </span>
          </a>
        </div>

        <div class="meta-row">
          <span class="clock-time" data-clock-time>00:00:00</span>
          <span class="meta-dot">·</span>
          <span class="clock-date" data-clock-date>01.01.2026</span>
        </div>
        <div class="copyright">© 2026 — KAAN ŞİMŞEK</div>
      </div>

      <!-- Mobile layout -->
      <div class="view view-mobile">
        <div class="intro-mobile">
          <div class="name-mobile">Kaan<br />Şimşek</div>
          <div class="role-mobile">Software Developer</div>
        </div>

        <div class="cards-list">
          <a
            class="list-card list-card--1"
            href="https://www.linkedin.com/in/kaansimsekk"
            target="_blank"
            rel="noopener"
          >
            <span class="list-card-index">01</span>
            <span class="list-card-label">Linkedin</span>
            <span class="list-card-arrow">↗</span>
          </a>

          <a
            class="list-card list-card--2"
            href="https://github.com/kaansimseq"
            target="_blank"
            rel="noopener"
          >
            <span class="list-card-index">02</span>
            <span class="list-card-label">Github</span>
            <span class="list-card-arrow">↗</span>
          </a>

          <a
            class="list-card list-card--3"
            href="https://apps.apple.com/us/developer/kaan-simsek/id1811808533"
            target="_blank"
            rel="noopener"
          >
            <span class="list-card-index">03</span>
            <span class="list-card-label">My Apps</span>
            <span class="list-card-arrow">↗</span>
          </a>

          <a
            class="list-card list-card--4"
            href="images/KaanSimsekCV.pdf"
            target="_blank"
            rel="noopener"
          >
            <span class="list-card-index">04</span>
            <span class="list-card-label">CV</span>
            <span class="list-card-arrow">↗</span>
          </a>
        </div>

        <div class="mobile-spacer"></div>

        <div class="meta-row-mobile">
          <span class="clock-mobile">
            <span data-clock-time>00:00:00</span>
            <span>·</span>
            <span data-clock-date>01.01.2026</span>
          </span>
          <span class="copyright-mobile">© 2026</span>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
